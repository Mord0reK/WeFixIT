name: Docker build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Docker image tag
        required: false
        default: latest
        type: string

permissions:
  contents: read

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/mord0rek/wefixit
  DB_IMAGE_NAME: ghcr.io/mord0rek/wefixit-db

jobs:
  build:
    name: Budowanie obrazu Docker
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/prod.Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=wefixit-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=wefixit-${{ matrix.arch }}

      - name: Build and publish database image
        id: db-build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/database.Dockerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.DB_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=wefixit-db-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=wefixit-db-${{ matrix.arch }}

      - name: Export image digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${RUNNER_TEMP}/digests"
          echo "${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}" \
            > "${RUNNER_TEMP}/digests/app-${{ matrix.arch }}"
          echo "${{ env.DB_IMAGE_NAME }}@${{ steps.db-build.outputs.digest }}" \
            > "${RUNNER_TEMP}/digests/db-${{ matrix.arch }}"

      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: image-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error

  manifest:
    name: Tworzenie multi-arch manifestu
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: image-digest-*
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and push multi-platform manifest
        shell: bash
        env:
          IMAGE_TAG: ${{ inputs.tag || 'latest' }}
        run: |
          set -euo pipefail
          mapfile -t digests < <(cat "${RUNNER_TEMP}/digests"/app-*)
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:${IMAGE_TAG}" \
            "${digests[@]}"

      - name: Create and push database multi-platform manifest
        shell: bash
        env:
          DB_IMAGE_TAG: ${{ inputs.tag || 'latest' }}
        run: |
          set -euo pipefail
          mapfile -t digests < <(cat "${RUNNER_TEMP}/digests"/db-*)
          docker buildx imagetools create \
            --tag "${DB_IMAGE_NAME}:${DB_IMAGE_TAG}" \
            "${digests[@]}"
