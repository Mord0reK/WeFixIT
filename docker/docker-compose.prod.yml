name: wefixit

services:
  wefixit:
    image: ghcr.io/mord0rek/wefixit:${IMAGE_TAG:-latest}
    ports:
      - "127.0.0.1:8080:80"
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      mariadb:
        condition: service_healthy

  mariadb:
    image: ghcr.io/mord0rek/wefixit-db:${IMAGE_TAG:-latest}
    volumes:
      - db_data:/var/lib/mysql
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test:
        - CMD
        - healthcheck.sh
        - --connect
        - --innodb_initialized
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

volumes:
  db_data:
