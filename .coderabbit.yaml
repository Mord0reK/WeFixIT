# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: "pl-PL"

tone_instructions: >-
  Pisz po polsku, krótko i technicznie. Bez pochwał i dygresji.
  W komentarzu wskaż problem, praktyczny skutek i konkretną poprawkę.

early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false

  high_level_summary: true
  high_level_summary_in_walkthrough: false
  high_level_summary_instructions: |
    Napisz krótkie podsumowanie faktycznych zmian w PR po polsku.
    Maksymalnie 5–8 zwięzłych punktów.
    Nie twórz release notes, rozbudowanych sekcji ani nie powtarzaj
    komentarzy z code review.

  review_status: false
  review_details: false
  review_progress: false
  commit_status: false

  collapse_walkthrough: true

  changed_files_summary: false
  sequence_diagrams: false
  estimate_code_review_effort: false

  assess_linked_issues: false
  related_issues: false
  related_prs: false

  suggested_labels: false
  suggested_reviewers: false

  in_progress_fortune: false
  poem: false

  enable_prompt_for_ai_agents: false

  slop_detection:
    enabled: false

  path_filters:
    - "!public/assets/css/app.css"

  path_instructions:
    - path: "**/*"
      instructions: |
        Stosuj standardy projektu opisane w AGENTS.md.

        Review służy wykrywaniu rzeczywistych błędów przed mergem,
        zarówno oczywistych, jak i trudnych do zauważenia.

        Zgłaszaj problem tylko wtedy, gdy możesz wskazać konkretną
        ścieżkę wykonania prowadzącą do błędu runtime, regresji,
        luki bezpieczeństwa, utraty lub niespójności danych,
        błędnej authorization albo naruszenia funkcjonalnego
        wymagania projektu.

        Reguły formatowania, nazewnictwa i komentarzy są wskazówkami
        dla implementacji, nie powodem do kosmetycznych uwag review.

        Każdy komentarz powinien:
        - wskazywać konkretny problem,
        - wyjaśniać jego praktyczny skutek,
        - proponować najmniejszą poprawkę rozwiązującą problem.

        Dla lokalnej, jednoznacznej i bezpiecznej poprawki użyj
        committable code suggestion nadającego się do GitHub
        Apply suggestion.

        Nie wymuszaj suggestion, jeśli poprawka wymaga decyzji
        projektowej albo zmian w wielu miejscach.

        Nie proponuj niezwiązanych refactorów, dodatkowych warstw,
        kosmetycznych zmian ani hipotetycznych problemów
        bez uzasadnienia.

    - path: "**/*.php"
      instructions: |
        Kod PHP ma być zgodny z PHP 8.2.

        Sprawdzaj szczególnie:
        - proceduralne PDO,
        - prepared statements dla wszystkich dynamicznych danych SQL,
        - SQL injection,
        - poprawną obsługę błędów operacji bazodanowych,
        - server-side validation,
        - escaping danych wyświetlanych w HTML,
        - CSRF przy operacjach zmieniających stan,
        - kontrolę sesji,
        - kontrolę roli użytkownika,
        - ownership zasobów na chronionych endpointach,
        - password_hash() i password_verify(),
        - brak sekretów i credentials w kodzie,
        - niebezpieczne przekierowania i manipulację parametrami,
        - poprawny podział odpowiedzialności pomiędzy konfigurację,
          DB, authentication, authorization, walidację, logikę biznesową,
          actions i widoki.

        Actions i kontrolery powinny koordynować operacje, a nie zawierać
        całej logiki biznesowej ani dużych fragmentów HTML.

        Nie proponuj klas, wzorców projektowych ani dodatkowych warstw
        tylko po to, aby zastąpić poprawny proceduralny kod.

  auto_review:
    enabled: true
    description_keyword: ""
    labels: []
    auto_incremental_review: false
    drafts: false

  pre_merge_checks:
    docstrings:
      mode: "off"
    title:
      mode: "off"
    description:
      mode: "off"
    issue_assessment:
      mode: "off"
    custom_checks: []

  finishing_touches:
    docstrings:
      enabled: false
    unit_tests:
      enabled: false
    simplify:
      enabled: false
    autofix:
      enabled: false
    fix_ci:
      enabled: false
    resolve_merge_conflict:
      enabled: false
    custom: []

chat:
  art: false
  auto_reply: true
